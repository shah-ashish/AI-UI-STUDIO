name: CI/CD Pipeline & Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ==============================================================================
  # 1. Test & Build Verification
  # ==============================================================================
  test:
    name: Run Unit Tests & Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm install --no-audit --no-fund

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund
          cd ..

      - name: Run Test Suites
        run: npm test

      - name: Build Frontend Static Bundle
        run: |
          cd frontend
          npm run build
          cd ..

  # ==============================================================================
  # 2. Docker Image Build, Test & GHCR Publish
  # ==============================================================================
  docker:
    name: Build Docker Image & Verify
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ github.event_name == 'pull_request' }} # Load locally for testing on PRs
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker Container Healthcheck
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name test-ai-ui -p 5000:5000 ghcr.io/${{ github.repository }}:latest || \
          docker run -d --name test-ai-ui -p 5000:5000 $(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          sleep 6
          curl --fail http://localhost:5000/api/health || exit 1
          docker stop test-ai-ui
