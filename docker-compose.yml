services:
  ai-ui-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-ui-studio
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - BASE_URL=http://ollama:11434
      - MODEL_NAME=qwen2.5-coder:14b
      - TIMEOUT=1200
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ai-ui-studio-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # Uncomment deploy section if NVIDIA GPU is available
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama_models:
